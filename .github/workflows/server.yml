name: Server
run-name: ${{ github.actor }} server tests
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libarmadillo-dev libsuperlu-dev libjsoncpp-dev libblas-dev liblapack-dev
          pip install -r server/requirements-dev.txt

      - name: Build the shared library
        run: bash scripts/build_shared_lib.sh /tmp/gensas-lib

      - name: Test the server against api/openapi.yaml
        run: python -m pytest server/tests -q
        env:
          GENSAS_LIBRARY: /tmp/gensas-lib/libgensas.so
