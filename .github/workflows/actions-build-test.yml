name: Build checks
run-name: ${{ github.actor }} Build test
on:
  push:
  workflow_dispatch:

env:
  # Bump to start from empty Bazel caches (the disk cache only grows).
  CACHE_VERSION: v1

jobs:
  Build-Test-Linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server."
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      # Bazel's disk cache holds action outputs (including the foreign_cc builds of
      # OpenBLAS, SuperLU, ...); the repository cache holds downloaded archives.
      - name: Configure Bazel caches
        run: |
          printf 'build --disk_cache=%s/.bazel-ci-cache/disk\nbuild --repository_cache=%s/.bazel-ci-cache/repo\n' "$HOME" "$HOME" > .bazelrc.local
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bazel-ci-cache
          key: bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'tools/**') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'tools/**') }}-
            bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-
      - run: bazel build //...
      - run: bazel test //...
      # Saved from main only: caches written on a branch are not visible to other
      # branches, and every save is a new multi-hundred-MB entry.  Runs even when
      # the build failed, so partial progress is kept.
      - name: Save Bazel caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.bazel-ci-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - run: echo "This job's status is ${{ job.status }}."

  Build-Test-MacOs:
    runs-on: macos-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server."
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
      - name: Install dependencies
        # gcc provides gfortran (required by armadillo/linear-algebra targets).
        # cmake is required by rules_foreign_cc cmake() rules.
        # The macOS .bazelrc exposes /opt/homebrew/opt/gcc/bin so the versioned
        # gfortran symlink installed by brew is visible inside Bazel sandboxes.
        run: brew install gcc cmake
        env:
          # Skip the Homebrew self-update, cleanup and analytics: they only cost time here.
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      # On macOS Bazel's output base is under /private/var/tmp, not ~/.cache/bazel,
      # so cache explicit disk/repository cache directories instead.
      - name: Configure Bazel caches
        run: |
          printf 'build --disk_cache=%s/.bazel-ci-cache/disk\nbuild --repository_cache=%s/.bazel-ci-cache/repo\n' "$HOME" "$HOME" > .bazelrc.local
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bazel-ci-cache
          key: bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'tools/**') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'tools/**') }}-
            bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-
      - run: bazel build //...
      - run: bazel test //...
      - name: Save Bazel caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.bazel-ci-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - run: echo "This job's status is ${{ job.status }}."

  # Windows (MSYS2 / MinGW-w64), see doc/Installation.md.  A required check: a failure
  # must show as a failure (no continue-on-error).
  Build-Test-Windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYS2_ARG_CONV_EXCL: "*"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-make
      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Configure Bazel caches
        run: |
          printf 'build --disk_cache=C:/bazel-ci-cache/disk\nbuild --repository_cache=C:/bazel-ci-cache/repo\n' > .bazelrc.local
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/bazel-ci-cache
          key: bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'tools/**') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'tools/**') }}-
            bazel-${{ runner.os }}-${{ env.CACHE_VERSION }}-
      # //... skips the targets that are Linux/macOS-only (e.g. pcre).
      - run: bazel build //...
      - run: bazel test //...
      # Save even when the build failed so progress (e.g. finished dependency
      # builds) is not lost; main only, see the Linux job.
      - name: Save Bazel caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: C:/bazel-ci-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
