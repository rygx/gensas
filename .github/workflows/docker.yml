name: Docker
run-name: ${{ github.actor }} docker image
on: [push, pull_request]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build the image and run it (check, run, web client, non-root, read-only file system)
        run: bash scripts/docker_smoke_test.sh
